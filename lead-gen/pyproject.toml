[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "safeway-lead-gen"
version = "1.0.0"
description = "Lead generation automation and product sourcing for Safeway Distributors"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "selenium>=4.17.2",
    "lxml>=5.1.0",
    "httpx>=0.27.0",
    "notion-client>=2.2.1",
    "slack-sdk>=3.27.1",
    "pandas>=2.2.0",
    "phonenumbers>=8.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "responses>=0.25.0",
    "factory-boy>=3.3.1",
    "ruff>=0.3.0",
]

[project.scripts]
leadgen = "src.cli:cli"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
